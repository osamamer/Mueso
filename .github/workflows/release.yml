name: Release

# Every push to main publishes a signed release. Obtainium on each Android
# device watches this repo's releases and installs new builds automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          BASE=$(sed -n 's/.*versionName = System.getenv("VERSION_NAME") ?: "\(.*\)"/\1/p' app/build.gradle.kts)
          COUNT=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$((100 + COUNT))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${BASE}-osama.${COUNT}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing; refusing to publish a build with a random signing key." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Build signed release APKs
        env:
          KEYSTORE_PATH: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          find app/build/outputs/apk -name '*-release.apk' -exec cp {} out/ \;
          ls -lh out
          gh release create "$VERSION_NAME" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "Mueso $VERSION_NAME" \
            --notes "Automated build of \`${GITHUB_SHA::7}\`. Use the \`full\` APKs for Mueso and the \`calm\` APKs for Mueso Calm; \`arm64-v8a\` fits almost every modern device."
